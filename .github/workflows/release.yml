name: Release

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag or branch)'
        required: true
        type: string
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          # Pinned to windows-2025: windows-latest now resolves to the
          # windows-2025-vs2026 image, whose VS 2026 toolchain is not yet
          # detected by node-gyp 11.x (breaks electron-rebuild of native deps).
          - os: windows-2025
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Get build parameters
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout alma source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: yetone/alma
          token: ${{ secrets.ALMA_REPO_TOKEN }}
          ref: ${{ steps.params.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ matrix.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Linux: rpmbuild is required by the electron-builder rpm target
      - name: Install rpm tooling
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # macOS: Import certificates for code signing
      - name: Import macOS certificates
        if: matrix.platform == 'mac'
        env:
          CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Clean up
          rm -f $RUNNER_TEMP/certificate.p12

      # Build application
      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
        run: pnpm run make -- --${{ matrix.arch }}

      # Upload artifacts for the publish job
      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.AppImage
            dist-electron/*.yml
            dist-electron/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout alma source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: yetone/alma
          token: ${{ secrets.ALMA_REPO_TOKEN }}
          ref: ${{ steps.params.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      # Download all build artifacts at once
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist-artifacts

      - name: Merge artifacts and macOS yml files
        run: |
          mkdir -p dist-electron

          # Copy mac artifacts
          cp dist-artifacts/build-mac-arm64/*.dmg dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-mac-arm64/*.zip dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-mac-arm64/*.blockmap dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-mac-x64/*.dmg dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-mac-x64/*.zip dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-mac-x64/*.blockmap dist-electron/ 2>/dev/null || true

          # Merge latest-mac.yml files
          ARM64_YML="dist-artifacts/build-mac-arm64/latest-mac.yml"
          X64_YML="dist-artifacts/build-mac-x64/latest-mac.yml"
          MERGED_YML="dist-electron/latest-mac.yml"

          if [ -f "$ARM64_YML" ] && [ -f "$X64_YML" ]; then
            echo "Merging latest-mac.yml files..."

            VERSION=$(grep "^version:" "$ARM64_YML" | head -1)
            RELEASE_DATE=$(grep "^releaseDate:" "$ARM64_YML" | head -1)

            ARM64_FILES=$(awk '/^files:/{flag=1; next} /^[a-zA-Z]/ && flag{flag=0} flag' "$ARM64_YML")
            X64_FILES=$(awk '/^files:/{flag=1; next} /^[a-zA-Z]/ && flag{flag=0} flag' "$X64_YML")

            PATH_LINE=$(grep "^path:" "$ARM64_YML" | head -1)
            SHA512_LINE=$(grep "^sha512:" "$ARM64_YML" | head -1)

            echo "$VERSION" > "$MERGED_YML"
            echo "files:" >> "$MERGED_YML"
            echo "$ARM64_FILES" >> "$MERGED_YML"
            echo "$X64_FILES" >> "$MERGED_YML"
            echo "$PATH_LINE" >> "$MERGED_YML"
            echo "$SHA512_LINE" >> "$MERGED_YML"
            echo "$RELEASE_DATE" >> "$MERGED_YML"

            echo "Merged latest-mac.yml:"
            cat "$MERGED_YML"
          elif [ -f "$ARM64_YML" ]; then
            cp "$ARM64_YML" "$MERGED_YML"
          elif [ -f "$X64_YML" ]; then
            cp "$X64_YML" "$MERGED_YML"
          fi

          # Copy win & linux artifacts
          cp dist-artifacts/build-win-x64/* dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-linux-x64/* dist-electron/ 2>/dev/null || true

          rm -rf dist-artifacts
          echo "=== All artifacts ==="
          ls -la dist-electron/

      # Generate changelog BEFORE uploading so we only upload yml files once
      - name: Get previous tag
        id: prev_tag
        run: |
          CURRENT_TAG="v${{ steps.params.outputs.version }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1)
          if [ "$PREV_TAG" = "$CURRENT_TAG" ] || [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          fi
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Generate changelog with LLM
        id: changelog
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          CURRENT_TAG="v${{ steps.params.outputs.version }}"
          echo "Fetching commits between ${{ steps.prev_tag.outputs.prev_tag }} and $CURRENT_TAG"
          COMMITS=$(git log ${{ steps.prev_tag.outputs.prev_tag }}..$CURRENT_TAG --pretty=format:"%s" --no-merges 2>/dev/null || git log --pretty=format:"%s" --no-merges -20)

          echo "Found commits:"
          echo "$COMMITS"

          if [ -z "$COMMITS" ]; then
            echo "No commits found, using fallback"
            echo "### Changes" > /tmp/changelog.md
            echo "" >> /tmp/changelog.md
            echo "- Various improvements and bug fixes" >> /tmp/changelog.md
            exit 0
          fi

          PROMPT=$(cat <<PROMPT_EOF
          Based on the following git commit messages, generate a concise and user-friendly changelog in markdown format. Group changes by category (e.g., Features, Bug Fixes, Improvements). Only include meaningful changes, skip trivial commits. Use clear, non-technical language where possible. Output ONLY the changelog content without any preamble.

          Commit messages:
          $COMMITS
          PROMPT_EOF
          )

          RESPONSE=$(curl -s https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -d "$(jq -n --arg prompt "$PROMPT" '{
              "model": "deepseek-v4-pro",
              "messages": [{"role": "user", "content": $prompt}]
            }')")

          # DeepSeek responses can contain raw (unescaped) newlines inside JSON
          # strings, which strict parsers like jq reject; python strict=False allows them.
          CHANGELOG=$(echo "$RESPONSE" | python3 -c 'import json,sys; d=json.loads(sys.stdin.read(), strict=False); print(d["choices"][0]["message"]["content"])' 2>/dev/null || true)

          if [ -z "$CHANGELOG" ]; then
            echo "::warning::LLM changelog generation failed, falling back to raw commit list. API response:"
            echo "$RESPONSE"
            CHANGELOG=$(cat <<FALLBACK_EOF
          ### Changes
          $COMMITS
          FALLBACK_EOF
            )
          fi

          echo "$CHANGELOG" > /tmp/changelog.md
          echo "Generated changelog:"
          cat /tmp/changelog.md

      - name: Update latest.yml files with changelog
        run: |
          for yml_file in dist-electron/*.yml; do
            if [ -f "$yml_file" ]; then
              echo "" >> "$yml_file"
              echo "releaseNotes: |" >> "$yml_file"
              while IFS= read -r line; do
                echo "  $line" >> "$yml_file"
              done < /tmp/changelog.md
              echo "Updated $yml_file with release notes"
            fi
          done

      # Upload to Cloudflare R2 (all files in parallel)
      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto

      - name: Upload to Cloudflare R2
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          ls dist-electron/ | xargs -P 4 -I {} sh -c '
            echo "Uploading {}..."
            aws s3 cp "dist-electron/{}" "s3://alma-updates/{}" \
              --endpoint-url "'"$R2_ENDPOINT"'"
          '
          echo "All files uploaded to R2!"

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ steps.params.outputs.version }}
          name: Alma v${{ steps.params.outputs.version }}
          draft: false
          generate_release_notes: false
          body_path: /tmp/changelog.md
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.AppImage
            dist-electron/*.yml
            dist-electron/*.blockmap

      - name: Post to Discord #release-notes
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          VERSION="v${{ steps.params.outputs.version }}"
          CHANGELOG=$(cat /tmp/changelog.md)
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${VERSION}"

          # Discord message has a 2000 char limit, truncate if needed
          MESSAGE="## Alma ${VERSION}

          ${CHANGELOG}

          **Download:** ${RELEASE_URL}"

          # Trim to Discord limit
          if [ ${#MESSAGE} -gt 1990 ]; then
            MESSAGE="${MESSAGE:0:1987}..."
          fi

          jq -n --arg content "$MESSAGE" '{content: $content}' | \
            curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
