name: Release

# Orchestrator: four single-platform builds (build-platform.yml) and two
# publish legs (publish-platform.yml). Win/Linux go live on their feeds as
# soon as those builds finish (~25min) instead of waiting for the slow mac
# builds (~50min); the mac leg publishes when both mac architectures are done
# and posts the Discord announcement last.

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag or branch)'
        required: true
        type: string
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  params:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.params.outputs.ref }}
      version: ${{ steps.params.outputs.version }}
    steps:
      - name: Get build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

  build-mac-arm64:
    needs: params
    uses: ./.github/workflows/build-platform.yml
    secrets: inherit
    with:
      os: macos-latest
      platform: mac
      arch: arm64
      ref: ${{ needs.params.outputs.ref }}
      version: ${{ needs.params.outputs.version }}

  build-mac-x64:
    needs: params
    uses: ./.github/workflows/build-platform.yml
    secrets: inherit
    with:
      os: macos-15-intel
      platform: mac
      arch: x64
      ref: ${{ needs.params.outputs.ref }}
      version: ${{ needs.params.outputs.version }}

  build-win-x64:
    needs: params
    uses: ./.github/workflows/build-platform.yml
    secrets: inherit
    with:
      # Pinned to windows-2025: windows-latest resolves to the
      # windows-2025-vs2026 image, whose VS 2026 toolchain is not yet
      # detected by node-gyp 11.x (breaks electron-rebuild of native deps).
      os: windows-2025
      platform: win
      arch: x64
      ref: ${{ needs.params.outputs.ref }}
      version: ${{ needs.params.outputs.version }}

  build-linux-x64:
    needs: params
    uses: ./.github/workflows/build-platform.yml
    secrets: inherit
    with:
      os: ubuntu-latest
      platform: linux
      arch: x64
      ref: ${{ needs.params.outputs.ref }}
      version: ${{ needs.params.outputs.version }}

  publish-win-linux:
    needs: [params, build-win-x64, build-linux-x64]
    uses: ./.github/workflows/publish-platform.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      ref: ${{ needs.params.outputs.ref }}
      version: ${{ needs.params.outputs.version }}
      artifact_pattern: 'build-{win,linux}-*'
      announce: false

  publish-mac:
    needs: [params, build-mac-arm64, build-mac-x64]
    uses: ./.github/workflows/publish-platform.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      ref: ${{ needs.params.outputs.ref }}
      version: ${{ needs.params.outputs.version }}
      artifact_pattern: 'build-mac-*'
      announce: true
