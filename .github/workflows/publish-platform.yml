name: Publish Platform

# Reusable per-platform publish. The win/linux leg goes live as soon as those
# builds finish (~25min); the mac leg follows when both mac builds are done.
# Feeds are per-platform files (latest.yml / latest-linux.yml / latest-mac.yml),
# so partial publishes are safe: each leg only touches its own feed files.
#
# Publishing order is load-bearing and now enforced:
#   1. every url a feed lists must be staged (step: Verify every advertised…),
#   2. artifacts upload to R2 before the feeds that advertise them,
#   3. the public host must serve each file with the staged byte count, then
#   4. the GitHub release must carry the same files, and
#   5. the announcing (mac) leg refuses to announce until all four feeds serve
#      this version with the sizes they promise.
# Skipping any of these is how v0.4.231 published a latest-mac.yml pointing at
# a .dmg that did not exist for 3h11m (alma postmortem 291).

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      artifact_pattern:
        description: 'Artifact name glob to download (e.g. build-mac-*)'
        required: true
        type: string
      announce:
        description: 'Post the Discord release note (mac leg only — it lands last)'
        required: false
        type: boolean
        default: false
      source_run_id:
        description: 'Run ID containing artifacts; defaults to the caller run'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to publish (tag or branch)'
        required: true
        type: string
      version:
        description: 'Version to publish (e.g., 0.4.33)'
        required: true
        type: string
      artifact_pattern:
        description: 'Artifact name glob to download (e.g. build-mac-*)'
        required: true
        type: string
      announce:
        description: 'Post the Discord release note after publishing'
        required: false
        type: boolean
        default: false
      source_run_id:
        description: 'Completed Release workflow run containing artifacts'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout alma source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: yetone/alma
          token: ${{ secrets.ALMA_REPO_TOKEN }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      # Download only this leg's artifacts (build-mac-* or build-win/linux-*)
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist-artifacts
          pattern: ${{ inputs.artifact_pattern }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Belt and braces: whatever the download pattern matched, a leg must
      # never publish the other leg's files — a win/linux publish that caught a
      # freshly-finished mac-arm64 artifact would write a latest-mac.yml with
      # only ONE architecture, breaking updates for the other.
      - name: Enforce leg isolation
        run: |
          # A pattern matching exactly ONE artifact is extracted flat into
          # dist-artifacts/ (no per-artifact folder), so the copy steps below
          # would find nothing. Put the files back under the artifact's name.
          pattern="${{ inputs.artifact_pattern }}"
          case "$pattern" in
            *'*'*|*'?'*|*'['*) ;;
            *)
              if [ -n "$pattern" ] && [ ! -d "dist-artifacts/$pattern" ] && [ -n "$(ls -A dist-artifacts 2>/dev/null)" ]; then
                mkdir -p "/tmp/$pattern" && mv dist-artifacts/* "/tmp/$pattern/" && mv "/tmp/$pattern" "dist-artifacts/$pattern"
              fi
              ;;
          esac
          case "${{ inputs.artifact_pattern }}" in
            build-mac-*)
              rm -rf dist-artifacts/build-win-* dist-artifacts/build-linux-*
              # The mac feed lists BOTH architectures; publishing with one
              # missing would break updates for the other.
              if [ ! -f dist-artifacts/build-mac-arm64/latest-mac.yml ] || [ ! -f dist-artifacts/build-mac-x64/latest-mac.yml ]; then
                echo "::error::mac publish requires both arm64 and x64 artifacts"
                exit 1
              fi
              ;;
            *) rm -rf dist-artifacts/build-mac-* ;;
          esac
          # An empty download (e.g. a glob that matched nothing) must fail loudly,
          # not silently publish nothing.
          if [ -z "$(ls -A dist-artifacts 2>/dev/null)" ]; then
            echo "::error::no artifacts matched pattern ${{ inputs.artifact_pattern }}"
            exit 1
          fi
          ls dist-artifacts/

      - name: Merge artifacts and macOS yml files
        run: |
          mkdir -p dist-electron

          # Copy mac artifacts
          cp dist-artifacts/build-mac-arm64/*.dmg dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-mac-arm64/*.zip dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-mac-arm64/*.blockmap dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-mac-x64/*.dmg dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-mac-x64/*.zip dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-mac-x64/*.blockmap dist-electron/ 2>/dev/null || true

          # Merge latest-mac.yml files
          ARM64_YML="dist-artifacts/build-mac-arm64/latest-mac.yml"
          X64_YML="dist-artifacts/build-mac-x64/latest-mac.yml"
          MERGED_YML="dist-electron/latest-mac.yml"

          if [ -f "$ARM64_YML" ] && [ -f "$X64_YML" ]; then
            echo "Merging latest-mac.yml files..."

            VERSION=$(grep "^version:" "$ARM64_YML" | head -1)
            RELEASE_DATE=$(grep "^releaseDate:" "$ARM64_YML" | head -1)

            ARM64_FILES=$(awk '/^files:/{flag=1; next} /^[a-zA-Z]/ && flag{flag=0} flag' "$ARM64_YML")
            X64_FILES=$(awk '/^files:/{flag=1; next} /^[a-zA-Z]/ && flag{flag=0} flag' "$X64_YML")

            PATH_LINE=$(grep "^path:" "$ARM64_YML" | head -1)
            SHA512_LINE=$(grep "^sha512:" "$ARM64_YML" | head -1)

            echo "$VERSION" > "$MERGED_YML"
            echo "files:" >> "$MERGED_YML"
            echo "$ARM64_FILES" >> "$MERGED_YML"
            echo "$X64_FILES" >> "$MERGED_YML"
            echo "$PATH_LINE" >> "$MERGED_YML"
            echo "$SHA512_LINE" >> "$MERGED_YML"
            echo "$RELEASE_DATE" >> "$MERGED_YML"

            echo "Merged latest-mac.yml:"
            cat "$MERGED_YML"
          elif [ -f "$ARM64_YML" ]; then
            cp "$ARM64_YML" "$MERGED_YML"
          elif [ -f "$X64_YML" ]; then
            cp "$X64_YML" "$MERGED_YML"
          fi

          # Copy win & linux artifacts
          cp dist-artifacts/build-win-x64/* dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-linux-x64/* dist-electron/ 2>/dev/null || true
          cp dist-artifacts/build-linux-arm64/* dist-electron/ 2>/dev/null || true

          rm -rf dist-artifacts
          echo "=== All artifacts ==="
          ls -la dist-electron/

      # A feed is a promise: every url it lists must exist, at that exact byte
      # count. v0.4.231 shipped a latest-mac.yml advertising
      # alma-0.4.231-mac-arm64.dmg at 23:24Z while that object only reached R2
      # at 02:35Z, so every Apple Silicon download on the website 404'd for
      # 3h11m and mac auto-update was broken (alma postmortem 291). The copy
      # steps above end in `|| true`, so a missing artifact never failed here.
      - name: Verify every advertised artifact is staged
        shell: bash
        run: |
          set -euo pipefail
          problems=0
          # Only the update feeds are promises. electron-builder also writes
          # builder-debug.yml (build metadata, no files: block); the first
          # release that ran this gate refused to publish because of it.
          for yml in dist-electron/latest*.yml; do
            [ -f "$yml" ] || continue
            count=0
            while IFS= read -r url; do
              count=$((count + 1))
              if [ ! -s "dist-electron/$url" ]; then
                echo "::error file=$yml::$yml advertises $url but no such file was staged"
                problems=$((problems + 1))
              fi
            # Only the `files:` block counts: releaseNotes is an indented block
            # scalar whose markdown may itself contain "- url:" lines.
            done < <(awk '
                       /^files:[[:space:]]*$/ { in_files = 1; next }
                       in_files && /^[^[:space:]]/ { in_files = 0 }
                       in_files && /^[[:space:]]*-[[:space:]]*url:/ {
                         sub(/^[[:space:]]*-[[:space:]]*url:[[:space:]]*/, "")
                         sub(/[[:space:]]+$/, "")
                         print
                       }
                     ' "$yml")
            if [ "$count" -eq 0 ]; then
              echo "::error file=$yml::$yml lists no artifacts"
              problems=$((problems + 1))
            fi
            echo "$yml: $count advertised artifact(s) checked"
          done
          if [ "$problems" -ne 0 ]; then
            echo "::error::refusing to publish a feed that points at files we do not have"
            exit 1
          fi

      # Generate changelog BEFORE uploading so we only upload yml files once
      - name: Get previous tag
        id: prev_tag
        run: |
          CURRENT_TAG="v${{ inputs.version }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1)
          if [ "$PREV_TAG" = "$CURRENT_TAG" ] || [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          fi
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Generate changelog with LLM
        id: changelog
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          CURRENT_TAG="v${{ inputs.version }}"
          echo "Fetching commits between ${{ steps.prev_tag.outputs.prev_tag }} and $CURRENT_TAG"
          COMMITS=$(git log ${{ steps.prev_tag.outputs.prev_tag }}..$CURRENT_TAG --pretty=format:"%s" --no-merges 2>/dev/null || git log --pretty=format:"%s" --no-merges -20)

          echo "Found commits:"
          echo "$COMMITS"

          if [ -z "$COMMITS" ]; then
            echo "No commits found, using fallback"
            echo "### Changes" > /tmp/changelog.md
            echo "" >> /tmp/changelog.md
            echo "- Various improvements and bug fixes" >> /tmp/changelog.md
            exit 0
          fi

          PROMPT=$(cat <<PROMPT_EOF
          Based on the following git commit messages, generate a concise and user-friendly changelog in markdown format. Group changes by category (e.g., Features, Bug Fixes, Improvements). Only include meaningful changes, skip trivial commits. Use clear, non-technical language where possible. Output ONLY the changelog content without any preamble.

          Commit messages:
          $COMMITS
          PROMPT_EOF
          )

          RESPONSE=$(curl -s https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -d "$(jq -n --arg prompt "$PROMPT" '{
              "model": "deepseek-v4-pro",
              "messages": [{"role": "user", "content": $prompt}]
            }')")

          # DeepSeek responses can contain raw (unescaped) newlines inside JSON
          # strings, which strict parsers like jq reject; python strict=False allows them.
          CHANGELOG=$(echo "$RESPONSE" | python3 -c 'import json,sys; d=json.loads(sys.stdin.read(), strict=False); print(d["choices"][0]["message"]["content"])' 2>/dev/null || true)

          if [ -z "$CHANGELOG" ]; then
            echo "::warning::LLM changelog generation failed, falling back to raw commit list. API response:"
            echo "$RESPONSE"
            CHANGELOG=$(cat <<FALLBACK_EOF
          ### Changes
          $COMMITS
          FALLBACK_EOF
            )
          fi

          echo "$CHANGELOG" > /tmp/changelog.md
          echo "Generated changelog:"
          cat /tmp/changelog.md

      - name: Update latest.yml files with changelog
        run: |
          for yml_file in dist-electron/*.yml; do
            if [ -f "$yml_file" ]; then
              echo "" >> "$yml_file"
              echo "releaseNotes: |" >> "$yml_file"
              while IFS= read -r line; do
                echo "  $line" >> "$yml_file"
              done < /tmp/changelog.md
              echo "Updated $yml_file with release notes"
            fi
          done

      # Upload to Cloudflare R2 (all files in parallel)
      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto

      # Each file gets 4 tries: R2 sometimes loses a part of a big multipart
      # upload (v0.4.235's linux-arm64 AppImage failed with InvalidPart on
      # CompleteMultipartUpload), and a fresh upload goes through.
      - name: Upload to Cloudflare R2
        env:
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # Artifacts first, feeds last. The old `ls | xargs` uploaded in
          # arbitrary order, so a latest-*.yml could go live while the file it
          # advertises was still in flight — the v0.4.231 404 window.
          artifacts=()
          feeds=()
          for entry in dist-electron/*; do
            [ -f "$entry" ] || continue
            case "$(basename "$entry")" in
              latest*.yml) feeds+=("$(basename "$entry")") ;;
              *) artifacts+=("$(basename "$entry")") ;;
            esac
          done

          upload() {
            name="$1"
            for attempt in 1 2 3 4; do
              echo "Uploading $name (attempt $attempt)..."
              if aws s3 cp "dist-electron/$name" "s3://alma-updates/$name" --endpoint-url "$R2_ENDPOINT"; then
                return 0
              fi
              if [ "$attempt" -lt 4 ]; then sleep $((attempt * 10)); fi
            done
            echo "::error::upload of $name failed 4 times"
            return 1
          }

          # Bounded pool without xargs: `xargs bash -c '…$1…'` trips shellcheck
          # (SC2016) and hides which upload failed behind exit code 123.
          run_pool() {
            max="$1"
            shift
            pids=()
            for name in "$@"; do
              upload "$name" &
              pids+=("$!")
              if [ "${#pids[@]}" -ge "$max" ]; then
                wait "${pids[0]}"
                pids=("${pids[@]:1}")
              fi
            done
            if [ "${#pids[@]}" -gt 0 ]; then
              for pid in "${pids[@]}"; do wait "$pid"; done
            fi
          }

          echo "Uploading ${#artifacts[@]} artifact(s)..."
          if [ "${#artifacts[@]}" -gt 0 ]; then run_pool 4 "${artifacts[@]}"; fi

          echo "Uploading ${#feeds[@]} feed file(s) last..."
          if [ "${#feeds[@]}" -gt 0 ]; then run_pool 1 "${feeds[@]}"; fi

          echo "All files uploaded to R2!"

      # Pre-upload the yml was checked against the staged files; here the CDN
      # is checked against the same files, which is what the client sees.
      - name: Verify the published feed serves every file
        shell: bash
        env:
          UPDATES_BASE_URL: https://updates.alma.now
        run: |
          set -euo pipefail
          problems=0
          for entry in dist-electron/*; do
            [ -f "$entry" ] || continue
            name=$(basename "$entry")
            want=$(stat -c%s "$entry")
            code=""; got=""
            for _ in 1 2 3 4 5; do
              headers=$(curl -sS -I --max-time 30 "$UPDATES_BASE_URL/$name" || true)
              code=$(printf '%s\n' "$headers" | head -1 | awk '{print $2}')
              got=$(printf '%s\n' "$headers" | tr -d '\r' | awk 'tolower($1) == "content-length:" {print $2; exit}')
              [ "$code" = "200" ] && [ "$got" = "$want" ] && break
              sleep 3
            done
            if [ "$code" != "200" ]; then
              echo "::error file=$name::$UPDATES_BASE_URL/$name answered HTTP $code after the upload"
              problems=$((problems + 1))
            elif [ "$got" != "$want" ]; then
              echo "::error file=$name::$UPDATES_BASE_URL/$name serves $got bytes, staged file is $want"
              problems=$((problems + 1))
            else
              echo "ok $name ($want bytes)"
            fi
          done
          if [ "$problems" -ne 0 ]; then
            echo "::error::the published feed does not serve every file it advertises"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ inputs.version }}
          name: Alma v${{ inputs.version }}
          draft: false
          generate_release_notes: false
          body_path: /tmp/changelog.md
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.AppImage
            dist-electron/*.tar.gz
            dist-electron/*.yml
            dist-electron/*.blockmap

      # action-gh-release never complains about a `files:` glob that matched no
      # path — it just uploads fewer assets. Ask the API what actually landed,
      # so a half-populated release fails here instead of in a user's browser.
      - name: Verify the GitHub release carries every artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases/tags/v${{ inputs.version }}" > /tmp/release.json
          problems=0
          for entry in dist-electron/*; do
            [ -f "$entry" ] || continue
            name=$(basename "$entry")
            want=$(stat -c%s "$entry")
            got=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' /tmp/release.json)
            if [ -z "$got" ]; then
              echo "::error file=$name::release v${{ inputs.version }} is missing $name"
              problems=$((problems + 1))
            elif [ "$got" != "$want" ]; then
              echo "::error file=$name::release v${{ inputs.version }} has $name at $got bytes, staged file is $want"
              problems=$((problems + 1))
            fi
          done
          if [ "$problems" -ne 0 ]; then
            echo "::error::release v${{ inputs.version }} does not carry every staged artifact"
            exit 1
          fi
          echo "release v${{ inputs.version }} carries every staged artifact"

      # The mac leg lands last, so at this point every platform should already be
      # on this version. v0.4.231 announced a mac feed that pointed at a .dmg
      # which did not exist for 3h11m; this read-back would have refused to
      # announce it (alma postmortem 291). Runs before the Discord message, so a
      # broken convergence leaves the release silent instead of paged.
      - name: Verify every feed converged on this version
        if: success() && inputs.announce
        shell: bash
        env:
          UPDATES_BASE_URL: https://updates.alma.now
        run: |
          set -euo pipefail
          expected="${{ inputs.version }}"
          problems=0
          for feed in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            code=$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/feed.yml \
                     -w '%{http_code}' "$UPDATES_BASE_URL/$feed" || true)
            # Releases before the linux arm64 leg existed never published this
            # feed (v0.4.100 has none). Re-announcing such a tag must not fail
            # the gate, so a 404 here is only a warning.
            if [ "$code" = "404" ] && [ "$feed" = "latest-linux-arm64.yml" ]; then
              echo "::warning::$feed is not published for this release — skipped"
              continue
            fi
            if [ "$code" != "200" ]; then
              echo "::error::$feed answered HTTP $code from $UPDATES_BASE_URL"
              problems=$((problems + 1))
              continue
            fi
            body=$(cat /tmp/feed.yml)

            version=$(printf '%s\n' "$body" | awk '/^version:[[:space:]]*/ { sub(/^version:[[:space:]]*/, ""); print; exit }')
            if [ "$version" != "$expected" ]; then
              echo "::error::$feed reports version '$version', expected '$expected'"
              problems=$((problems + 1))
              continue
            fi

            # Pair each files: entry's url with its size, ignoring releaseNotes
            # (an indented block scalar whose markdown may contain "- url:").
            checked=0
            while IFS=' ' read -r url size; do
              [ -n "$url" ] || continue
              checked=$((checked + 1))
              code=""
              got=""
              for _ in 1 2 3 4 5; do
                headers=$(curl -sS -I --max-time 30 "$UPDATES_BASE_URL/$url" || true)
                code=$(printf '%s\n' "$headers" | head -1 | awk '{print $2}')
                got=$(printf '%s\n' "$headers" | tr -d '\r' | awk 'tolower($1) == "content-length:" {print $2; exit}')
                if [ "$code" = "200" ] && { [ -z "$size" ] || [ "$got" = "$size" ]; }; then break; fi
                sleep 3
              done
              if [ "$code" != "200" ]; then
                echo "::error file=$url::$UPDATES_BASE_URL/$url answered HTTP $code"
                problems=$((problems + 1))
              elif [ -n "$size" ] && [ "$got" != "$size" ]; then
                echo "::error file=$url::$UPDATES_BASE_URL/$url serves $got bytes, $feed says $size"
                problems=$((problems + 1))
              fi
            done < <(printf '%s\n' "$body" | awk '
                       /^files:[[:space:]]*$/ { in_files = 1; next }
                       in_files && /^[^[:space:]]/ { in_files = 0 }
                       in_files && /^[[:space:]]*-[[:space:]]*url:/ {
                         url = $0
                         sub(/^[[:space:]]*-[[:space:]]*url:[[:space:]]*/, "", url)
                         sub(/[[:space:]]+$/, "", url)
                       }
                       in_files && /^[[:space:]]+size:[[:space:]]*/ {
                         size = $0
                         sub(/^[[:space:]]*size:[[:space:]]*/, "", size)
                         if (url != "") { print url " " size; url = "" }
                       }
                     ')

            if [ "$checked" -eq 0 ]; then
              echo "::error::$feed lists no artifacts"
              problems=$((problems + 1))
            else
              echo "$feed: v$version, $checked artifact(s) served"
            fi
          done

          if [ "$problems" -ne 0 ]; then
            echo "::error::feeds are not converged on v$expected — refusing to announce"
            exit 1
          fi
          echo "all feeds are converged on v$expected and serve every listed artifact"

      - name: Post to Discord #release-notes
        # Only the mac leg announces — it finishes last, so the release is
        # complete (all platforms live) by the time the message lands.
        # A webhook hiccup must not mark a completed release as failed — by this
        # point the R2 feed and GitHub release are already live (v0.0.975 was
        # fully published yet showed as 'failure' because only this step 4xx'd).
        continue-on-error: true
        if: success() && inputs.announce
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          VERSION="v${{ inputs.version }}"
          CHANGELOG=$(cat /tmp/changelog.md)
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${VERSION}"

          # Discord message has a 2000 char limit, truncate if needed
          MESSAGE="## Alma ${VERSION}

          ${CHANGELOG}

          **Download:** ${RELEASE_URL}"

          # Trim to Discord limit
          if [ ${#MESSAGE} -gt 1990 ]; then
            MESSAGE="${MESSAGE:0:1987}..."
          fi

          jq -n --arg content "$MESSAGE" '{content: $content}' | \
            curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
