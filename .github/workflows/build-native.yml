name: Build Native

# The mygo native app (desktop-native/, almapack), built with the release
# secrets: Developer ID + notarization on macOS, PostHog keys everywhere.
# Artifacts only - nothing here touches R2, the feeds or GitHub releases.
# Proves a signed native build before it joins release.yml.

on:
  push:
    branches: [native-build]
  workflow_dispatch:
    inputs:
      ref:
        description: 'alma ref to build'
        required: true
        type: string
      version:
        description: 'Version (default: the ref package.json)'
        required: false
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: mac, arch: arm64, target: darwin/arm64 }
          - { os: macos-latest, platform: mac, arch: x64, target: darwin/amd64 }
          - { os: windows-2025, platform: win, arch: x64, target: windows/amd64 }
          - { os: ubuntu-22.04, platform: linux, arch: x64, target: linux/amd64 }
          - { os: ubuntu-22.04-arm, platform: linux, arch: arm64, target: linux/arm64 }
    uses: ./.github/workflows/build-native-platform.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      target: ${{ matrix.target }}
      ref: ${{ github.event.inputs.ref || 'desktop-native-mygo' }}
      version: ${{ github.event.inputs.version || '' }}
      artifact: native-${{ matrix.platform }}-${{ matrix.arch }}
