name: Build Platform

# Reusable single-platform build. Split out of release.yml so publish jobs can
# depend on individual platforms (GitHub Actions cannot depend on one leg of a
# matrix) — win/linux publish no longer waits for the slow mac builds.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string
      ref:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout alma source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: yetone/alma
          token: ${{ secrets.ALMA_REPO_TOKEN }}
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ inputs.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.arch }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vendor binaries (bun/uv/rtk/lark-cli) are version-pinned and the
      # download scripts skip anything already present with a matching version
      # stamp — caching vendor/ turns ~2.5min of downloads into a no-op.
      - name: Cache vendor binaries
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: vendor
          key: ${{ runner.os }}-${{ inputs.arch }}-vendor-${{ hashFiles('scripts/download-bun.ts', 'scripts/download-uv.ts', 'scripts/download-rtk.ts', 'scripts/download-lark-cli.ts') }}

      # Linux: rpmbuild is required by the electron-builder rpm target
      - name: Install rpm tooling
        if: inputs.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # macOS: Import certificates for code signing
      - name: Import macOS certificates
        if: inputs.platform == 'mac'
        env:
          CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Clean up
          rm -f $RUNNER_TEMP/certificate.p12

      # Build application
      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          APPLE_ID: ${{ inputs.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
        run: pnpm run make -- --${{ inputs.arch }}

      # Upload artifacts for the publish job
      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-${{ inputs.platform }}-${{ inputs.arch }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.AppImage
            dist-electron/*.yml
            dist-electron/*.blockmap
          if-no-files-found: error
